<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI税関突破「嘘つきワード・ダウト」｜英語・壁打ち特化</title>
<meta name="description" content="怪しい審査官8人の尋問に、正しい英語の言い訳で切り抜ける英語・壁打ち特化アプリ。高校受験・共通テスト・難関大まで、全33ミッションの嘘つき突破ゲーム。">
<meta property="og:title" content="AI税関突破「嘘つきワード・ダウト」">
<meta property="og:description" content="誤用は即・検挙。正しい英語の嘘だけが、ゲートを開く。審査官8人を騙し抜く英語トレーニング。">
<meta property="og:type" content="website">
<meta property="og:image" content="og-image.png">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --ink:#1f2430; --paper:#f4f1e6; --paper2:#fffdf6;
  --navy:#16324f; --navy2:#1f4a73; --teal:#0e7c7b; --gold:#c9962e; --gold2:#eec25e;
  --pass:#1e8e4f; --pass2:#27ae60; --doubt:#b91c1c; --doubt2:#dc2626;
  --shadow:0 4px 14px rgba(31,36,48,.16);
  --ch1:#2563eb; --ch2:#0e7c7b; --ch3:#7c3aed; --ch4:#b91c1c;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Hiragino Sans","Noto Sans JP",sans-serif;
  background:#0d1622 radial-gradient(circle at 15% 0%, #274b73 0%, transparent 55%),
             radial-gradient(circle at 90% 100%, #4d3410 0%, transparent 50%);
  color:var(--ink); min-height:100vh;
}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--paper);
  box-shadow:0 0 40px rgba(0,0,0,.45); position:relative; overflow:hidden;
  display:flex; flex-direction:column;}
.screen{display:none; flex-direction:column; flex:1; min-height:0;}
.screen.active{display:flex;}
button{font-family:inherit; cursor:pointer;}
.btn{
  border:none; border-radius:999px; padding:14px 22px; font-size:17px; font-weight:800;
  background:linear-gradient(180deg,var(--navy2),var(--navy)); color:#fff;
  box-shadow:0 4px 0 #0b1e33, var(--shadow); transition:transform .06s, box-shadow .06s;
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 #0b1e33;}
.btn.sub{background:linear-gradient(180deg,#fdfdfd,#eae4cf); color:var(--ink); box-shadow:0 4px 0 #b3a888, var(--shadow);}
.btn.sub:active{box-shadow:0 1px 0 #b3a888;}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#4a2f00; box-shadow:0 4px 0 #8a6410, var(--shadow);}
.btn.gold:active{box-shadow:0 1px 0 #8a6410;}
.btn:disabled{opacity:.45; pointer-events:none;}
.btn.big{font-size:20px; padding:16px 30px; width:100%;}
.sound-toggle{
  border:2px solid var(--ink); background:#fff; border-radius:999px; padding:6px 14px;
  font-size:14px; font-weight:800;
}
.topbar{
  display:flex; align-items:center; gap:8px; padding:10px 14px;
  background:var(--paper2); border-bottom:2px solid #e7ddc2; position:sticky; top:0; z-index:5;
}
.topbar .tb-title{font-weight:900; font-size:15px; flex:1; line-height:1.3;}
.back-btn{
  border:2px solid var(--ink); background:#fff; border-radius:999px; padding:6px 13px;
  font-size:13.5px; font-weight:800;
}
.linklike{background:none;border:none;color:var(--navy2);font-weight:800;font-size:12.5px;text-decoration:underline;padding:2px;}
/* ---------- タイトル ---------- */
#screen-title{align-items:center; text-align:center; padding:30px 18px 16px;
  background:linear-gradient(180deg,#cfe3f5 0%, var(--paper) 58%);}
.title-band{
  background:linear-gradient(90deg,var(--navy),var(--teal)); color:#fff; font-weight:900;
  letter-spacing:.3em; padding:6px 16px 6px calc(16px + .3em); border-radius:4px; font-size:13.5px;
  box-shadow:var(--shadow);
}
h1.logo{margin:14px 0 2px; font-size:36px; line-height:1.3; font-weight:900; color:var(--ink);}
h1.logo .accent{color:var(--doubt);}
.title-sub{font-size:15px; font-weight:700; color:#4c5a6e; margin:6px 0 2px; line-height:1.7;}
.title-faces{display:flex; gap:6px; justify-content:center; margin:14px 0 4px; flex-wrap:wrap;}
.title-faces .ta-face{width:52px; height:52px; background:#fff; border:2px solid #cfd8e2; border-radius:50%; padding:2px;}
.title-stats{display:flex; gap:10px; justify-content:center; margin:12px 0 4px; flex-wrap:wrap;}
.stat-chip{
  background:#fff; border:2px solid #cfd8e2; border-radius:14px; padding:8px 14px;
  font-size:13px; font-weight:800; box-shadow:var(--shadow);
}
.stat-chip b{font-size:19px; color:var(--navy2);}
.title-badge{
  display:inline-block; background:var(--gold2); color:#4a2f00; font-weight:900;
  font-size:13.5px; border-radius:999px; padding:4px 14px; margin-top:6px;
}
.title-btns{display:flex; flex-direction:column; gap:12px; width:100%; max-width:340px; margin-top:16px;}
.title-foot{margin-top:auto; padding:18px 0 4px; font-size:12px; color:#8a8171; line-height:1.7;}
/* ---------- ステータスカード ---------- */
.status-card{
  margin:12px 14px 4px; background:linear-gradient(135deg,#0b1e33,#16324f 60%,#0e7c7b);
  color:#fff; border-radius:18px; padding:14px 16px; box-shadow:var(--shadow);
}
.status-card .sc-big{font-size:13px; font-weight:800; opacity:.92;}
.status-card .sc-big b{font-size:30px; line-height:1; margin-left:4px;}
.status-card .sc-row{font-size:13px; font-weight:700; margin-top:7px; display:flex; gap:14px; flex-wrap:wrap;}
.progress-track{height:9px; background:rgba(255,255,255,.28); border-radius:99px; margin-top:8px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--gold2),#f97316); border-radius:99px; transition:width .5s;}
.screen .progress-track{background:#e7ddc2;}
.screen .progress-fill{background:linear-gradient(90deg,var(--gold),var(--teal));}
/* ---------- マップ ---------- */
.level-bar{display:flex; gap:6px; flex-wrap:wrap; padding:12px 14px 2px; align-items:center;}
.level-bar .lb-label{font-size:11.5px; font-weight:800; color:#8a8171;}
.level-chip{
  border:2px solid #cfd8e2; background:#fff; border-radius:999px; padding:6px 13px;
  font-size:13px; font-weight:800;
}
.level-chip.active{background:var(--navy); border-color:var(--navy); color:#fff;}
.chapter-block{padding:10px 14px 2px;}
.chapter-head{
  font-weight:900; font-size:16px; margin:8px 0 8px; padding-left:10px; border-left:6px solid var(--navy);
}
.stages{display:flex; flex-direction:column; gap:10px; padding-bottom:16px;}
.stage-card{
  display:flex; gap:12px; align-items:center; text-align:left; width:100%;
  background:#fff; border:2px solid #cfd8e2; border-radius:16px; padding:12px 14px;
  box-shadow:var(--shadow); border-left:8px solid var(--navy);
}
.stage-card .st-face{width:58px; height:58px; flex:none; background:var(--paper); border-radius:50%; padding:2px; border:2px solid #cfd8e2;}
.stage-card .st-main{flex:1; min-width:0;}
.stage-card .st-id{font-size:11.5px; font-weight:900; color:#8a8171; letter-spacing:.08em;}
.stage-card .st-title{font-size:16.5px; font-weight:900; line-height:1.35; margin:1px 0;}
.stage-card .st-author{font-size:13px; font-weight:700; color:#4c5a6e;}
.stage-card .st-meta{display:flex; gap:10px; align-items:center; margin-top:5px;}
.stage-card .st-prog{font-size:12.5px; font-weight:800; color:var(--navy2);}
.mini-track{flex:1; height:7px; background:#dde5ec; border-radius:99px; overflow:hidden;}
.mini-fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--teal));}
/* ---------- 紹介 ---------- */
.intro-body{padding:14px 16px 8px; overflow-y:auto;}
.intro-level{
  display:inline-block; background:#dbe7f3; border-radius:999px; padding:3px 12px;
  font-size:12px; font-weight:800; color:#33506e;
}
.intro-body h2{font-size:21px; line-height:1.4; margin:10px 0 12px;}
.author-profile{
  display:flex; gap:14px; background:#fff; border:2px solid #cfd8e2; border-radius:16px;
  padding:14px; box-shadow:var(--shadow); align-items:flex-start;
}
.author-profile .ap-avatar{width:96px; height:96px; flex:none; background:var(--paper); border-radius:50%; padding:3px; border:2px solid #cfd8e2;}
.ap-name{font-size:18px; font-weight:900; line-height:1.35;}
.ap-genre{font-size:12.5px; font-weight:800; color:var(--navy2); margin-top:2px;}
.ap-quirk{font-size:13.5px; line-height:1.6; color:#4c4658; margin-top:5px;}
.greeting{
  margin-top:12px; background:#eef5fb; border:2px dashed #9db8d2; border-radius:14px;
  padding:12px 14px; font-size:15px; line-height:1.75;
}
.intro-list-head{font-weight:900; font-size:14px; margin:16px 0 6px;}
.iv-list{display:flex; flex-direction:column; gap:7px;}
.iv-item{
  display:flex; gap:10px; align-items:center; background:#fff; border:2px solid #e7ddc2;
  border-radius:12px; padding:9px 12px; font-size:14px;
}
.iv-item .iv-state{font-size:11px; font-weight:900; border-radius:999px; padding:2px 9px; flex:none;}
.iv-state.done{background:#bbf7d0; color:#14532d;}
.iv-state.weak{background:#fecaca; color:#7f1d1d;}
.iv-state.todo{background:#e5e0d0; color:#6b6552;}
.intro-btns{padding:12px 16px 18px; display:flex; flex-direction:column; gap:10px;}
/* ---------- セッション ---------- */
#screen-session{background:var(--paper);}
.session-head{
  padding:10px 14px 8px; background:var(--paper2); border-bottom:2px solid #e7ddc2;
  position:sticky; top:0; z-index:5;
}
.sh-row{display:flex; align-items:center; gap:8px;}
.sh-row .gh-stage{font-size:12px; font-weight:900; color:#8a8171; letter-spacing:.05em;}
.sh-row .gh-topic{flex:1; font-size:13.5px; font-weight:800; line-height:1.3; min-width:0;}
.sh-row .gh-count{font-size:12.5px; font-weight:900; color:var(--navy2);}
.session-author{
  display:flex; gap:12px; align-items:center; padding:10px 14px 4px;
}
.session-author .sa-face{width:74px; height:74px; flex:none; background:#fff; border-radius:50%; padding:3px; border:2px solid #cfd8e2; position:relative;}
.session-author .sa-face.aura{box-shadow:0 0 0 4px var(--pass2), 0 0 26px 8px rgba(39,174,96,.6);}
.session-author .sa-name{font-size:16px; font-weight:900;}
.session-author .sa-int{font-size:12.5px; font-weight:800; color:var(--navy2);}
.situation-card{
  margin:8px 14px 4px; background:#fffdf6; border:2px solid #d9c98a; border-radius:14px;
  padding:12px 14px; box-shadow:var(--shadow);
}
.situation-card .pc-label{font-size:11px; font-weight:900; letter-spacing:.2em; color:#8a6d1f;}
.situation-card .pc-text{font-size:15.5px; line-height:1.85; margin-top:4px;}
.situation-card .goal{
  margin-top:9px; background:#eef5fb; border:1.5px dashed #7aa3c7; border-radius:10px;
  padding:8px 11px; font-size:14px; line-height:1.65; font-weight:700; color:#274b73;
}
.situation-card .goal .g-label{font-size:11px; font-weight:900; letter-spacing:.14em; color:#33506e; display:block;}
#dialogue-feed{flex:1; overflow-y:auto; padding:10px 14px; display:flex; flex-direction:column; gap:10px; min-height:120px;}
.msg{
  max-width:88%; border-radius:16px; padding:10px 13px; font-size:15px; line-height:1.75;
  box-shadow:var(--shadow); white-space:pre-wrap; word-break:break-word; position:relative;
}
.msg .msg-who{
  display:block; font-size:11px; font-weight:900; letter-spacing:.06em; margin-bottom:3px;
}
.msg.author{background:#fff; border:2px solid #cfd8e2; align-self:flex-start; border-bottom-left-radius:4px;}
.msg.author .msg-who{color:var(--navy2);}
.msg.user{background:linear-gradient(180deg,#fdf3d0,#fbe9b7); border:2px solid #e3cf8d; align-self:flex-end; border-bottom-right-radius:4px;}
.msg.user .msg-who{color:#8a6d1f;}
.msg.pushback{background:#fdf0f0; border:2px solid #d88a8a; align-self:flex-start; border-bottom-left-radius:4px;}
.msg.pushback .msg-who{color:#a11d1d;}
.msg.pushback .misuse{display:block; margin-top:6px; font-size:12.5px; font-weight:800; color:#7f1d1d; background:#fee2e2; border-radius:8px; padding:5px 9px;}
.msg.pass{background:linear-gradient(180deg,#eafaf0,#d3f4e0); border:2px solid var(--pass); align-self:flex-start; border-bottom-left-radius:4px;}
.msg.pass .msg-who{color:var(--pass);}
.msg.memo{background:#eef4f4; border:2px solid #9db8b8; align-self:stretch; max-width:100%;}
.msg.memo .msg-who{color:var(--teal);}
.stamp-card{
  margin:2px 0; background:linear-gradient(135deg,#0d3b21,#1e8e4f); color:#eafff2;
  border-radius:14px; padding:12px 14px; box-shadow:var(--shadow); align-self:stretch; max-width:100%;
}
.stamp-card .hc-label{font-size:11px; font-weight:900; letter-spacing:.18em; color:var(--gold2);}
.stamp-card .hc-stamp{
  display:inline-block; margin-top:7px; border:3px solid #eafff2; border-radius:9px;
  padding:3px 13px; font-size:17px; font-weight:900; letter-spacing:.06em; transform:rotate(-3deg);
  background:rgba(255,255,255,.12);
}
.stamp-card .hc-text{font-size:15.5px; line-height:1.8; margin-top:9px; white-space:pre-wrap; font-weight:700;}
.stamp-card .hc-gain{font-size:12.5px; font-weight:900; color:#fff; margin-top:6px;}
.strategy-card{
  background:#fff; border:2px solid var(--teal); border-radius:14px; padding:12px 14px;
  box-shadow:var(--shadow); align-self:stretch; max-width:100%;
}
.strategy-card .sc-head{font-weight:900; font-size:15.5px; color:var(--teal); line-height:1.5;}
.strategy-card .sc-label{font-size:11px; font-weight:900; letter-spacing:.14em; color:#8a8171; margin-top:8px;}
.strategy-card .sc-text{font-size:14.5px; line-height:1.75; margin-top:2px;}
.strategy-card .sc-text.trap{color:#a11d1d;}
#input-area{padding:10px 14px 14px; background:var(--paper2); border-top:2px solid #e7ddc2;}
#input-area textarea{
  width:100%; min-height:74px; border:2px solid #d9c98a; border-radius:14px; padding:11px 12px;
  font-size:16px; line-height:1.6; font-family:inherit; background:#fff; resize:vertical;
}
.hint-chips{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 2px; align-items:center;}
.hint-chips .hc-label2{font-size:11px; font-weight:900; color:#8a8171;}
.hint-chip{
  background:#eef5fb; border:1.5px dashed #7aa3c7; color:#274b73; border-radius:999px;
  padding:4px 11px; font-size:12.5px; font-weight:700;
}
.free-row{display:flex; gap:10px; margin-top:9px; align-items:stretch;}
.free-row .btn{flex:1;}
.mic-btn{
  border:2px solid var(--ink); background:#fff; border-radius:999px; width:56px; flex:none;
  display:flex; align-items:center; justify-content:center;
}
.mic-btn.rec{background:#fecaca; border-color:#a11d1d;}
.choices{display:flex; flex-direction:column; gap:9px;}
.choice-btn{
  text-align:left; background:#fff; border:2px solid #d9c98a; border-radius:14px;
  padding:12px 13px; font-size:15px; line-height:1.65; box-shadow:var(--shadow);
  display:flex; gap:9px; align-items:flex-start;
}
.choice-btn .ch-id{
  flex:none; background:var(--navy); color:#fff; font-weight:900; border-radius:8px;
  padding:1px 9px; font-size:13px; margin-top:2px;
}
.choice-btn:active{transform:scale(.99);}
.giveup-row{margin-top:10px; text-align:center;}
#next-row{padding:10px 14px 16px; background:var(--paper2); border-top:2px solid #e7ddc2;}
.shake{animation:shake .45s;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.lean{animation:lean .6s;}
@keyframes lean{0%{transform:scale(1)}40%{transform:scale(1.13) rotate(-2deg)}100%{transform:scale(1.05)}}
/* ---------- 結果 ---------- */
.result-body{padding:18px 16px; overflow-y:auto; text-align:center;}
.result-body .r-int{font-size:14px; font-weight:800; color:#4c5a6e;}
.result-body .r-int b{font-size:38px; color:var(--navy2);}
.result-list{margin:16px 0; text-align:left; display:flex; flex-direction:column; gap:8px;}
.result-item{
  display:flex; justify-content:space-between; gap:12px; background:#fff; border:2px solid #e7ddc2;
  border-radius:12px; padding:10px 13px; font-size:14.5px;
}
.result-item span:last-child{font-weight:900; text-align:right;}
.result-btns{display:flex; flex-direction:column; gap:10px; margin-top:8px;}
/* ---------- スタンプ帳 ---------- */
.memo-body{padding:12px 14px 18px; overflow-y:auto;}
.memo-author-head{display:flex; gap:11px; align-items:center; margin:14px 0 8px;}
.memo-author-head .ma-face{width:52px; height:52px; background:#fff; border-radius:50%; padding:2px; border:2px solid #cfd8e2;}
.memo-author-head .ma-name{font-size:16.5px; font-weight:900;}
.memo-author-head .ma-int{font-size:12px; font-weight:800; color:var(--navy2);}
.memo-item{background:#fff; border:2px solid #e7ddc2; border-radius:14px; padding:11px 13px; margin-bottom:9px;}
.memo-item .mi-topic{font-weight:900; font-size:14.5px; line-height:1.45;}
.memo-item .mi-meta{font-size:11.5px; font-weight:800; color:#8a8171; margin-top:2px;}
.memo-item .mi-stamp{
  display:inline-block; margin-top:8px; border:3px solid var(--pass); color:var(--pass);
  border-radius:9px; padding:3px 12px; font-size:14.5px; font-weight:900; transform:rotate(-2.5deg);
  background:#f0fdf4; letter-spacing:.04em;
}
.memo-item .mi-honne{font-size:14.5px; line-height:1.75; margin-top:8px; background:#eefaf2; border-radius:10px; padding:9px 11px; font-weight:700;}
.memo-item .mi-strategy{font-size:13.5px; line-height:1.7; margin-top:7px; color:#14532d;}
.memo-item .mi-locked{font-size:13.5px; color:#8a8171; margin-top:6px; line-height:1.6;}
.memo-item .mi-row{display:flex; justify-content:flex-end; margin-top:8px;}
.memo-item .mi-row .btn{padding:9px 18px; font-size:14px;}
.empty-note{
  text-align:center; color:#8a8171; font-size:14.5px; line-height:1.8; padding:26px 10px;
}
/* ---------- 演出 ---------- */
#confetti-canvas{position:fixed; inset:0; pointer-events:none; z-index:60;}
#fx-flash{position:fixed; inset:0; background:#fff8d6; opacity:0; pointer-events:none; z-index:55; transition:opacity .5s;}
#fx-stamp{
  position:fixed; left:50%; top:34%; transform:translate(-50%,-50%) rotate(-10deg) scale(3);
  border:5px solid var(--pass); color:var(--pass); border-radius:12px; padding:6px 22px;
  font-size:30px; font-weight:900; letter-spacing:.08em; opacity:0; pointer-events:none; z-index:61;
  background:rgba(255,253,246,.88); max-width:88vw; text-align:center; line-height:1.3;
}
#fx-stamp.doubt{border-color:var(--doubt); color:var(--doubt);}
#fx-stamp.show{animation:stamp .9s forwards;}
@keyframes stamp{0%{opacity:0; transform:translate(-50%,-50%) rotate(-10deg) scale(3)}
  35%{opacity:1; transform:translate(-50%,-50%) rotate(-10deg) scale(1)}
  80%{opacity:1} 100%{opacity:0; transform:translate(-50%,-50%) rotate(-10deg) scale(.96)}}
</style>
</head>
<body>
<div id="app">

  <!-- タイトル -->
  <section class="screen" id="screen-title">
    <div class="title-band">AI税関突破</div>
    <h1 class="logo">嘘つき<br><span class="accent">ワード・ダウト</span></h1>
    <p class="title-sub">怪しい審査官8人が、キミの言い訳を待っている。<br>誤用は即・検挙。正しい英語の嘘だけが、ゲートを開く。</p>
    <div class="title-faces" id="title-faces"></div>
    <div class="title-stats">
      <span class="stat-chip">バウンティ <b id="title-bounty">0</b>/925</span>
      <span class="stat-chip">獲得スタンプ <b id="title-stamps">0</b>/33</span>
    </div>
    <div><span class="title-badge" id="title-rank">素直な旅行者</span></div>
    <div class="title-btns">
      <button class="btn big gold" id="btn-to-map">税関ゲートへ進む</button>

<script>
/* === LOGIC START === */
const LiarLogic = (() => {
// テキスト正規化：空白・句読点・記号を除去し小文字化する（姉妹アプリと同一方式）
function normalizeText(s) {
  if (s == null) return "";
  let t = String(s);
  t = t.replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
  t = t.replace(/[\s　、。，．・：；:;,.「」『』（）()［］<>＜＞!?！？〜~～…‥"”'’`｜|/／\-ー―_]/g, "");
  return t.toLowerCase();
}

// acceptable_keywords を「言い換えファミリー」にまとめる。
// 一方が他方を内包するキーワード同士（例：apologize と apologize to）は同じファミリーとして1つに数える。
function keywordFamilies(mission) {
  const raw = [...new Set((mission.correct_answer?.acceptable_keywords || []).map(normalizeText).filter(Boolean))];
  const families = [];
  for (const kw of raw) {
    let placed = false;
    for (const fam of families) {
      if (fam.some((m) => m.includes(kw) || kw.includes(m))) { fam.push(kw); placed = true; break; }
    }
    if (!placed) families.push([kw]);
  }
  return families;
}
// 入力が充足したファミリー数（ファミリー内のどれか1つが含まれれば充足）
function familyHits(mission, normalizedInput) {
  return keywordFamilies(mission).filter((fam) => fam.some((m) => normalizedInput.includes(m))).length;
}
// 自由入力の正解しきい値：模範解答（canonical_english）自身が充足するファミリー数を上限2・下限1として使う。
// 言い換え候補が並ぶデータ（don't have to / needn't など）では模範解答は1ファミリーしか充足しないため、
// 「模範解答が通る」ことがそのまま妥当なしきい値になる。複数ポイントを要する問（C8_M03など）では2になる。
function freeNeed(mission) {
  const canonHits = familyHits(mission, normalizeText(mission.correct_answer?.canonical_english || ""));
  return Math.min(2, Math.max(1, canonHits));
}
// 判定に使うキーワード（正規化＋重複除去）
function usableKeywords(mission) {
  return [...new Set((mission.correct_answer?.acceptable_keywords || []).map(normalizeText).filter(Boolean))];
}

// 自由入力のトラップ照合（トラップ優先。ただし誤爆防止ガード2種つき・姉妹アプリと同一方式）
// ガード1：trigger を内包する acceptable キーワードが入力に含まれていれば、その trigger は除外
//         （例：C6_M02 の trigger「count」は正解キーワード「accounts for」に内包される）
// ガード2：trigger と無関係な核心キーワードだけですでに正解しきい値（ファミリー数）に達している入力は、
//         汎用的な trigger 語の混入で上書きしない（例：C8_M03 の trigger「and」）
function matchTrapByText(mission, normalizedInput) {
  const acceptN = usableKeywords(mission);
  const need = freeNeed(mission);
  for (const trap of mission.trap_comedies || []) {
    for (const trig of trap.trigger || []) {
      const tn = normalizeText(trig);
      if (!tn) continue;
      if (!normalizedInput.includes(tn)) continue;
      if (acceptN.some((a) => a.includes(tn) && normalizedInput.includes(a))) continue;
      const independentHits = keywordFamilies(mission)
        .filter((fam) => !fam.some((m) => m.includes(tn)))
        .filter((fam) => fam.some((m) => normalizedInput.includes(m))).length;
      if (independentHits >= need) continue;
      return trap;
    }
  }
  return null;
}

function judgeFreeText(mission, input) {
  const n = normalizeText(input);
  if (!n) return { result: "fallback", trap: null, hits: 0 };
  const trap = matchTrapByText(mission, n);
  if (trap) return { result: "trap", trap, hits: 0 };
  const hits = familyHits(mission, n);
  if (hits >= freeNeed(mission)) return { result: "correct", trap: null, hits };
  return { result: "fallback", trap: null, hits };
}

function findChoice(mission, choiceId) {
  return (mission.choices || []).find((c) => c.id === choiceId) || null;
}

// 選択式のトラップ照合：trigger に選択肢IDが含まれていればそのトラップ
function matchTrapByChoice(mission, choiceId) {
  for (const trap of mission.trap_comedies || []) {
    for (const trig of trap.trigger || []) {
      if (trig === choiceId) return trap;
    }
  }
  return null;
}

function judgeChoice(mission, choiceId) {
  // トラップ照合を正解判定より優先する（指令書・姉妹アプリの方式）
  const trap = matchTrapByChoice(mission, choiceId);
  if (trap) return { result: "trap", trap };
  if (mission.correct_answer && choiceId === mission.correct_answer.choice_id) {
    return { result: "correct", trap: null };
  }
  return { result: "fallback", trap: null };
}

// レベル絞込：target_level の表記で振り分ける
function matchesLevel(stage, filter) {
  if (!filter || filter === "all") return true;
  const lvl = stage.target_level || "";
  if (filter === "junior") return lvl.includes("高校受験");
  if (filter === "common") return lvl.includes("共通テスト");
  if (filter === "exam") return lvl.includes("難関大") || lvl.includes("二次");
  return true;
}

// 嘘つきランク（バウンティ合計 0〜925 に対して7段階）
const BOUNTY_TITLES = [
  { min: 925, title: "嘘の神（AIキラー）" },
  { min: 700, title: "伝説の嘘つき" },
  { min: 550, title: "国際ペテン師" },
  { min: 400, title: "ゲートブレイカー" },
  { min: 250, title: "言い訳上手" },
  { min: 100, title: "嘘つき見習い" },
  { min: 0, title: "素直な旅行者" },
];
function bountyTitle(total) {
  for (const t of BOUNTY_TITLES) if (total >= t.min) return t.title;
  return "素直な旅行者";
}

function totalBountyOf(chapters) {
  let total = 0;
  for (const c of chapters) for (const st of c.stages) for (const m of st.missions) {
    total += m.pass_reaction?.bounty_points || 0;
  }
  return total;
}
function totalMissionsOf(chapters) {
  return chapters.reduce((n, c) => n + c.stages.reduce((m, st) => m + st.missions.length, 0), 0);
}
function stageBounty(stage) {
  return stage.missions.reduce((n, m) => n + (m.pass_reaction?.bounty_points || 0), 0);
}
// ステージ内で獲得済みのバウンティ（スタンプ獲得ミッション分のみ）
function stageEarned(state, stage) {
  let sum = 0;
  for (const m of stage.missions) {
    if (state.stamps[m.mission_id]) sum += m.pass_reaction?.bounty_points || 0;
  }
  return sum;
}

// 進捗への誤答記録：コンボをリセットし、リベンジ待ち（復習対象）へ入れる
function applyWrong(state, missionId) {
  state.combo = 0;
  state.weak[missionId] = true;
}
// 突破成功：初回のみバウンティを加算。一発成功（そのセッションで誤答0）ならリベンジ待ちから外す
function applyPass(state, mission, wrongAttempts) {
  let pointsAdded = 0;
  if (!state.stamps[mission.mission_id]) {
    pointsAdded = mission.pass_reaction?.bounty_points || 0;
    state.bounty += pointsAdded;
  }
  state.stamps[mission.mission_id] = true;
  state.combo = (state.combo || 0) + 1;
  if (state.combo > (state.bestCombo || 0)) state.bestCombo = state.combo;
  let removedWeak = false;
  if (wrongAttempts === 0 && state.weak[mission.mission_id]) {
    delete state.weak[mission.mission_id];
    removedWeak = true;
  }
  return { pointsAdded, removedWeak };
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

return {
  normalizeText, keywordFamilies, familyHits, freeNeed, usableKeywords,
  matchTrapByText, judgeFreeText, findChoice, matchTrapByChoice, judgeChoice, matchesLevel,
  BOUNTY_TITLES, bountyTitle, totalBountyOf, totalMissionsOf, stageBounty, stageEarned,
  applyWrong, applyPass, escapeHtml,
};
})();

const confetti = (() => {
  const cv = document.getElementById("confetti-canvas");

    ctx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter((p) => p.y < cv.height + 24);
    for (const p of parts) {
      p.y += p.vy; p.x += p.vx + Math.sin(p.y / 26) * 1.2; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.62);
      ctx.restore();
    }
    if (parts.length) requestAnimationFrame(tick);
    else { running = false; ctx.clearRect(0, 0, cv.width, cv.height); }
  }
  return function spawn(n) {
    for (let i = 0; i < n; i++) {
      parts.push({
        x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.35,
        vx: (Math.random() - 0.5) * 2.2, vy: 2.4 + Math.random() * 3.2,
        s: 7 + Math.random() * 8, rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.24,
        color: COLORS[i % COLORS.length],
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  };
})();
function flashFx() {
  const f = document.getElementById("fx-flash");
  f.style.opacity = "0.85";
  setTimeout(() => { f.style.opacity = "0"; }, 130);
}
function stampFx(text, kind) {
  const s = document.getElementById("fx-stamp");

  s.classList.toggle("doubt", kind === "doubt");
  s.classList.remove("show"); void s.offsetWidth; s.classList.add("show");

}
function runPassEffect() {

}

}
</script>
<script>

/* ---------- ステージ紹介 ---------- */
let introCtx = null;

/* ---------- セッション ---------- */
let session = null;
let memoReturn = "title";
function startStage(chapter, stage) {
  session = {
    mode: "stage", chapter, stage,
    queue: stage.missions.slice(), idx: 0,
    wrongAttempts: 0, solvedCount: 0, gainTotal: 0, gaveUpCount: 0,
    solved: false, gaveUp: false,
  };
  show("session");
  loadMission();
}
function startSingle(missionId) {
  const hit = M_INDEX.get(missionId);
  if (!hit) return;
  session = {
    mode: "single", chapter: hit.chapter, stage: hit.stage,
    queue: [hit.mission], idx: 0,
    wrongAttempts: 0, solvedCount: 0, gainTotal: 0, gaveUpCount: 0,
    solved: false, gaveUp: false,
  };
  show("session");
  loadMission();
}
function currentMission() { return session.queue[session.idx]; }
function setInspectorFace(emotion, aura, lean) {
  const box = document.getElementById("session-avatar");
  box.innerHTML = renderInspector(session.stage.inspector.id, emotion);
  box.classList.toggle("aura", !!aura);
  box.classList.remove("lean"); void box.offsetWidth;
  if (lean) box.classList.add("lean");
}
function refreshInspectorLine() {
  document.getElementById("session-author-int").textContent =
    `このゲートのバウンティ ${L.stageEarned(prog, session.stage)}/${L.stageBounty(session.stage)} ・ 総バウンティ ${prog.bounty}`;
}
function addMsg(cls, who, text, misuse) {
  const feed = document.getElementById("dialogue-feed");
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerHTML = `<span class="msg-who">${L.escapeHtml(who)}</span>${L.escapeHtml(text)}`
    + (misuse ? `<span class="misuse">検挙理由：${L.escapeHtml(misuse)}</span>` : "");
  feed.appendChild(d);
  feed.scrollTop = feed.scrollHeight;
  return d;
}
function addNode(node) {
  const feed = document.getElementById("dialogue-feed");
  feed.appendChild(node);
  feed.scrollTop = feed.scrollHeight;
  return node;
}
function examCardHtml(m) {
  const es = m.exam_note;
  return `<div class="sc-head">受験メモ：${L.escapeHtml(es.headline)}</div>
    <div class="sc-label">鉄則</div><div class="sc-text">${L.escapeHtml(es.rule)}</div>
    <div class="sc-label">陥りやすい罠</div><div class="sc-text trap">${L.escapeHtml(es.pitfall)}</div>`;
}
function showExamCard(m) {
  const d = document.createElement("div");
  d.className = "strategy-card";
  d.innerHTML = examCardHtml(m);
  addNode(d);
}
function loadMission() {
  const m = currentMission();
  const p = session.stage.inspector;
  session.wrongAttempts = 0;
  session.solved = false;
  session.gaveUp = false;
  document.getElementById("session-stage-badge").textContent = session.stage.stage_id + " ・ 第" + session.chapter.chapter_id + "章";
  document.getElementById("session-topic").textContent = m.topic_tag;
  document.getElementById("session-count").textContent = `${session.idx + 1} / ${session.queue.length}`;
  document.getElementById("session-progress").style.width = (session.idx / session.queue.length * 100) + "%";
  document.getElementById("session-author-name").textContent = p.name;
  refreshInspectorLine();
  document.getElementById("situation-text").textContent = m.situation;
  document.getElementById("goal-text").textContent = m.target_lie_goal;
  document.getElementById("next-row").style.display = "none";
  const feed = document.getElementById("dialogue-feed");
  feed.innerHTML = "";
  setInspectorFace("normal", false, false);
  if (session.idx === 0) addMsg("author", p.name, p.opening_line);
  addMsg("author", p.name, m.inspector_question);
  renderInput(m);
  feed.scrollTop = 0;
}
function renderInput(m) {
  const area = document.getElementById("input-area");
  area.innerHTML = "";
  area.style.display = "";
  if (m.input_mode === "lie_compose") {
    const chips = document.createElement("div");
    chips.className = "hint-chips";
    chips.innerHTML = `<span class="hc-label2">突破の型：</span><span class="hint-chip">${L.escapeHtml(m.topic_tag)}</span><span class="hint-chip">${L.escapeHtml(m.target_lie_goal)}</span>`;
    area.appendChild(chips);
    const ta = document.createElement("textarea");
    ta.id = "free-input";
    ta.placeholder = "英語で言い訳を入力：正しい文法・語法の嘘で審査官を騙そう";
    ta.setAttribute("aria-label", "英語の言い訳を入力");
    ta.setAttribute("lang", "en");
    area.appendChild(ta);
    const row = document.createElement("div");
    row.className = "free-row";
    const send = document.createElement("button");
    send.className = "btn gold";
    send.textContent = "言い訳する！";
    send.onclick = () => submitFree();
    row.appendChild(send);
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      const mic = document.createElement("button");
      mic.className = "mic-btn";
      mic.innerHTML = `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#1f2430" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="#1f2430" stroke="none"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`;
      mic.setAttribute("aria-label", "音声入力");
      mic.onclick = () => startVoice(mic, ta);
      row.appendChild(mic);
    }
    area.appendChild(row);
  } else {
    const box = document.createElement("div");
    box.className = "choices";
    for (const c of m.choices || []) {
      const b = document.createElement("button");
      b.className = "choice-btn";
      b.dataset.choiceId = c.id;
      b.innerHTML = `<span class="ch-id">${L.escapeHtml(c.id)}</span><span>${L.escapeHtml(c.label)}</span>`;
      b.onclick = () => submitChoice(m, c, b);
      box.appendChild(b);
    }
    area.appendChild(box);
  }
  maybeShowGiveUp(m);
}
function maybeShowGiveUp(m) {
  if (session.solved || session.gaveUp) return;
  if (session.wrongAttempts < 2) return;
  const area = document.getElementById("input-area");
  if (area.querySelector(".giveup-row")) return;
  const row = document.createElement("div");
  row.className = "giveup-row";
  const b = document.createElement("button");
  b.className = "linklike";
  b.textContent = "どうしても突破できなければ、正しい嘘の文例を見る（スタンプはもらえず、リベンジ待ちに残ります）";
  b.onclick = () => giveUp(m);
  row.appendChild(b);
  area.appendChild(row);
}
function startVoice(btn, ta) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  try {
    const rec = new SR();
    rec.lang = "en-US";
    rec.interimResults = false;
    btn.classList.add("rec");
    rec.onresult = (ev) => {
      const text = ev.results[0][0].transcript || "";
      ta.value = (ta.value ? ta.value + " " : "") + text;
    };
    rec.onend = () => btn.classList.remove("rec");
    rec.onerror = () => btn.classList.remove("rec");
    rec.start();
  } catch (e) { btn.classList.remove("rec"); }
}
const FALLBACK_LINES = [
  "……何を言っているのか分からんな。その言い訳ではゲートは開かんぞ。",
  "ふむ、怪しいな。文法か語法がズレている気がするぞ。もう一度だ。",
  "ダウト！ その英語では通さん。『嘘の目標』に合う正しい型で言い直せ。",
];
function afterWrong(m, verdict) {
  L.applyWrong(prog, m.mission_id);
  session.wrongAttempts++;
  saveProgress();
  const card = document.getElementById("session-card");
  card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  SFX.boke();
  stampFx("DOUBT! 誤用検挙", "doubt");
  const p = session.stage.inspector;
  setInspectorFace(session.wrongAttempts >= 2 ? "angry" : "doubt", false, false);
  if (verdict.result === "trap" && verdict.trap) {
    addMsg("pushback", p.name + "（検挙！）", verdict.trap.comedy_tsukkomi, verdict.trap.misuse_meaning);
  } else {
    addMsg("pushback", p.name + "（疑いの目）", FALLBACK_LINES[Math.min(session.wrongAttempts - 1, FALLBACK_LINES.length - 1)]);
  }
  maybeShowGiveUp(m);
}
function submitFree() {
  if (!session || session.solved || session.gaveUp) return;
  const m = currentMission();
  const ta = document.getElementById("free-input");
  const text = (ta.value || "").trim();
  if (!text) { ta.focus(); return; }
  addMsg("user", "旅行者（キミ）", text);
  const verdict = L.judgeFreeText(m, text);
  if (verdict.result === "correct") passMission(m);
  else afterWrong(m, verdict);
}
function submitChoice(m, choice, btn) {
  if (!session || session.solved || session.gaveUp) return;
  addMsg("user", "旅行者（キミ）", choice.label);
  const verdict = L.judgeChoice(m, choice.id);
  if (verdict.result === "correct") passMission(m);
  else {
    btn.disabled = true;
    btn.style.opacity = ".45";
    afterWrong(m, verdict);
  }
}
function finishMissionUI() {
  document.getElementById("input-area").style.display = "none";
  const row = document.getElementById("next-row");
  row.style.display = "";
  const last = session.idx + 1 >= session.queue.length;
  document.getElementById("btn-next-mission").textContent = last ? "結果を見る →" : "次の尋問へ →";
  document.getElementById("session-progress").style.width = ((session.idx + 1) / session.queue.length * 100) + "%";
  const feed = document.getElementById("dialogue-feed");
  feed.scrollTop = feed.scrollHeight;
}
function passMission(m) {
  session.solved = true;
  const res = L.applyPass(prog, m, session.wrongAttempts);
  session.solvedCount++;
  session.gainTotal += res.pointsAdded;
  saveProgress();
  const pr = m.pass_reaction;
  const p = session.stage.inspector;
  runPassEffect();
  stampFx(pr.stamp_text, "pass");
  setInspectorFace("convinced", true, true);
  addMsg("pass", p.name + "（納得）", pr.inspector_line);
  const card = document.createElement("div");
  card.className = "stamp-card";
  card.innerHTML = `<div class="hc-label">ゲート突破 ― スタンプ帳に押しました</div>`
    + `<span class="hc-stamp">${L.escapeHtml(pr.stamp_text)}</span>`
    + `<div class="hc-text">${L.escapeHtml(m.correct_answer.canonical_english)}</div>`
    + `<div class="hc-gain">${res.pointsAdded > 0 ? "バウンティ +" + res.pointsAdded : "バウンティは獲得済み（再突破で腕が上がった！）"}</div>`;
  addNode(card);
  showExamCard(m);
  refreshInspectorLine();
  finishMissionUI();
}
function giveUp(m) {
  if (session.solved || session.gaveUp) return;
  session.gaveUp = true;
  session.gaveUpCount++;
  L.applyWrong(prog, m.mission_id);
  saveProgress();
  SFX.tap();
  setInspectorFace("doubt", false, false);
  addMsg("memo", "正しい嘘の文例", m.correct_answer.canonical_english);
  addMsg("memo", "税関メモ", "スタンプは自分の英語で突破してこそ獲得できます。この尋問はスタンプ帳の「リベンジ待ち」に残ります。");
  showExamCard(m);
  finishMissionUI();
}
function nextMission() {
  SFX.tap();
  if (session.idx + 1 < session.queue.length) {
    session.idx++;
    loadMission();
  } else {
    showResult();
  }
}
function showResult() {
  document.getElementById("result-bounty").textContent = prog.bounty;
  document.getElementById("result-rank").textContent = L.bountyTitle(prog.bounty);
  const list = document.getElementById("result-list");
  const rows = [];
  if (session.mode === "stage") {
    rows.push(["ゲート", `${session.stage.stage_id} ${session.stage.stage_title}`]);
    rows.push(["突破できた尋問", `${session.solvedCount} / ${session.queue.length}`]);
  } else {
    rows.push(["リベンジ", currentMission().topic_tag]);
    rows.push(["結果", session.solved ? (session.wrongAttempts === 0 ? "一発突破！リストから卒業" : "突破！（リストには残ります）") : "また今度リベンジ"]);
  }
  rows.push(["獲得したバウンティ", `+${session.gainTotal}`]);
  rows.push(["獲得スタンプ（累計）", `${stampCount()} / ${TOTAL_MISSIONS}`]);
  rows.push(["最高コンボ", `${prog.bestCombo}`]);
  list.innerHTML = rows.map(([k, v]) => `<div class="result-item"><span>${L.escapeHtml(k)}</span><span>${L.escapeHtml(v)}</span></div>`).join("");
  document.getElementById("result-weak").textContent = weakCount();
  show("result");
}

/* ---------- スタンプ帳 ---------- */
function renderMemo() {
  const body = document.getElementById("memo-body");

  for (const c of CHAPTERS) for (const st of c.stages) {

document.getElementById("btn-start-stage").onclick = () => { SFX.fanfare(); if (introCtx) startStage(introCtx.chapter, introCtx.stage); };
document.getElementById("btn-intro-memo").onclick = () => { SFX.tap(); memoReturn = "intro"; renderMemo(); show("memo"); };
document.getElementById("btn-quit-session").onclick = () => { SFX.tap(); renderMap(); show("map"); };
document.getElementById("btn-next-mission").onclick = () => nextMission();
document.getElementById("btn-result-map").onclick = () => { SFX.tap(); renderMap(); show("map"); };
document.getElementById("btn-result-memo").onclick = () => { SFX.tap(); memoReturn = "map"; renderMemo(); show("memo"); };
document.getElementById("btn-memo-back").onclick = () => {
  SFX.tap();
  if (memoReturn === "title") { refreshTitle(); show("title"); }
  else if (memoReturn === "intro" && introCtx) show("intro");
  else { renderMap(); show("map"); }
};
document.getElementById("sound-toggle-title").onclick = toggleMute;
document.getElementById("sound-toggle-map").onclick = toggleMute;
document.getElementById("sound-toggle-memo").onclick = toggleMute;
document.getElementById("btn-update").onclick = () => {
  const u = new URL(location.href);
  u.searchParams.set("v", "1.0.0-" + Date.now());
  location.href = u.toString();
};

refreshSoundToggles();
refreshTitle();
show("title");
</script>
</body>
</html>
